<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Brio — Filter chips</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { padding: 26px 28px; background: #fff; font-family: 'Centura No 2', Nunito, system-ui, sans-serif; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
  .row:last-child { margin-bottom: 0; }
  .lbl { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #9EA1A2; min-width: 90px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 10rem; font-size: 12px; font-weight: 500; transition: all 150ms ease; cursor: pointer; }
  .c-default { background: #fff; color: #24282B; border: 1.5px solid #E4E1E5; }
  .c-default:hover { border-color: #00A3E0; color: #00A3E0; }
  .c-active { background: #00A3E0; color: #fff; border: 1.5px solid #00A3E0; }
  .c-active .x { font-size: 14px; line-height: 1; }
</style>
</head>
<body>
  <div class="row">
    <div class="lbl">Default</div>
    <span class="chip c-default">Bottleless</span>
    <span class="chip c-default">Top Load</span>
    <span class="chip c-default">Bottom Load</span>
    <span class="chip c-default">Countertop</span>
  </div>
  <div class="row">
    <div class="lbl">Active</div>
    <span class="chip c-active">Bottleless <span class="x">×</span></span>
    <span class="chip c-active">$200–$500 <span class="x">×</span></span>
    <span class="chip c-active">NSF Certified <span class="x">×</span></span>
  </div>
</body>
</html>
