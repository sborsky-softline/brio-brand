<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Brio — Type: Family</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { padding: 28px 32px; background: #fff; }
  .head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
  .name { font-size: 36px; font-weight: 700; color: #24282B; letter-spacing: -0.02em; }
  .sub { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #00A3E0; }
  .pangram { font-size: 22px; font-weight: 400; color: #24282B; line-height: 1.3; margin-top: 4px; }
  .weights { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 16px; border-top: 1px solid #E4E1E5; padding-top: 14px; }
  .w-cell { display: flex; flex-direction: column; gap: 2px; }
  .w-aa { font-size: 30px; color: #24282B; line-height: 1; }
  .w-meta { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #9EA1A2; }
</style>
</head>
<body>
  <div class="head">
    <div>
      <div class="sub">Brand Typeface</div>
      <div class="name">Centura No 2</div>
    </div>
    <div class="sub" style="color:#9EA1A2;">Fallback · Nunito</div>
  </div>
  <div class="pangram">Feel good about your water.</div>
  <div class="weights">
    <div class="w-cell"><div class="w-aa" style="font-weight:300;">Aa</div><div class="w-meta">Light · 300</div></div>
    <div class="w-cell"><div class="w-aa" style="font-weight:400;">Aa</div><div class="w-meta">Book · 400</div></div>
    <div class="w-cell"><div class="w-aa" style="font-weight:500;">Aa</div><div class="w-meta">Medium · 500</div></div>
    <div class="w-cell"><div class="w-aa" style="font-weight:700;">Aa</div><div class="w-meta">Bold · 700</div></div>
  </div>
</body>
</html>
