<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Brio — Navigation</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { padding: 0; background: #fff; font-family: 'Centura No 2', Nunito, system-ui, sans-serif; }
  .nav { display: flex; align-items: center; padding: 16px 28px; border-bottom: 1px solid #E4E1E5; gap: 28px; }
  .logo { display: flex; align-items: center; }
  .logo svg { width: 76px; height: auto; }
  ul { list-style: none; display: flex; gap: 22px; margin: 0; padding: 0; }
  li { font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; color: #24282B; cursor: pointer; }
  li.active { color: #00A3E0; }
  .icons { margin-left: auto; display: flex; gap: 14px; align-items: center; }
  .icon { width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; color: #24282B; position: relative; }
  .badge-count { position: absolute; top: -6px; right: -8px; background: #00A3E0; color: #fff; font-size: 9px; font-weight: 700; min-width: 16px; height: 16px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; padding: 0 4px; }
</style>
</head>
<body>
  <nav class="nav">
    <div class="logo">
      <img src="../assets/logo-color.svg" alt="Brio" style="height: 36px;" />
    </div>
    <ul>
      <li class="active">Dispensers</li>
      <li>Filtration</li>
      <li>Ice</li>
      <li>Accessories</li>
      <li>Sale</li>
    </ul>
    <div class="icons">
      <span class="icon" title="Search">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      </span>
      <span class="icon" title="Account">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
      </span>
      <span class="icon" title="Cart">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 5h2l3 12h11l2-9H6"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg>
        <span class="badge-count">2</span>
      </span>
    </div>
  </nav>
</body>
</html>
