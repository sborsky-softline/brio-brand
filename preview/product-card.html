<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Brio — Product card</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { padding: 24px; background: #F0F8FD; font-family: 'Centura No 2', Nunito, system-ui, sans-serif; display:flex; gap:18px; }
  .card {
    width: 220px; background: #fff; border-radius: 1.6rem; overflow: hidden;
    box-shadow: 0 2px 12px rgba(0,163,224,0.10); position: relative;
    transition: box-shadow 220ms cubic-bezier(0.16,1,0.3,1), transform 220ms cubic-bezier(0.16,1,0.3,1);
  }
  .card.hover { box-shadow: 0 8px 32px rgba(0,163,224,0.18); transform: translateY(-4px); }
  .image { aspect-ratio: 1; background: #E4E1E5; display:flex; align-items:center; justify-content:center; position: relative; }
  .image svg { width: 70%; height: 70%; }
  .badge { position: absolute; top: 12px; left: 12px; padding: 5px 10px; border-radius: 0.4rem; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #fff; background: #00A3E0; }
  .quick { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); padding: 8px 18px; background:#00A3E0; color:#fff; border:0; border-radius: 1.6rem; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; opacity:0; transition: opacity 220ms ease; }
  .card.hover .quick { opacity: 1; }
  .body { padding: 16px 18px 18px; }
  .series { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #00A3E0; margin-bottom: 6px; }
  .name { font-size: 15px; font-weight: 500; color: #24282B; line-height: 1.3; }
  .price { margin-top: 10px; }
  .price-sale { font-size: 18px; font-weight: 700; color: #00A3E0; }
  .price-orig { font-size: 13px; color: #9EA1A2; text-decoration: line-through; margin-left: 6px; }
  .lbl { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #9EA1A2; margin-bottom: 6px; }
</style>
</head>
<body>
  <div>
    <div class="lbl">Default</div>
    <div class="card">
      <div class="image">
        <span class="badge">50% Off</span>
        <svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect x="60" y="20" width="80" height="40" rx="8" fill="#90C6EA"/>
          <rect x="50" y="60" width="100" height="160" rx="14" fill="#fff" stroke="#9EA1A2" stroke-width="2"/>
          <rect x="70" y="90" width="60" height="80" rx="8" fill="#00A3E0"/>
          <rect x="80" y="180" width="40" height="14" rx="4" fill="#9EA1A2"/>
        </svg>
        <button class="quick">Quick Add</button>
      </div>
      <div class="body">
        <div class="series">Moderna Series</div>
        <div class="name">Self-Cleaning Bottom Load Dispenser</div>
        <div class="price"><span class="price-sale">$249.99</span><span class="price-orig">$499.99</span></div>
      </div>
    </div>
  </div>
  <div>
    <div class="lbl">Hover state</div>
    <div class="card hover">
      <div class="image">
        <span class="badge" style="background:#004D7A;">New</span>
        <svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect x="60" y="20" width="80" height="40" rx="8" fill="#90C6EA"/>
          <rect x="50" y="60" width="100" height="160" rx="14" fill="#fff" stroke="#9EA1A2" stroke-width="2"/>
          <rect x="70" y="90" width="60" height="80" rx="8" fill="#00A3E0"/>
          <rect x="80" y="180" width="40" height="14" rx="4" fill="#9EA1A2"/>
        </svg>
        <button class="quick">Quick Add</button>
      </div>
      <div class="body">
        <div class="series">Aqua Series</div>
        <div class="name">Countertop Reverse Osmosis System</div>
        <div class="price"><span class="price-sale" style="color:#24282B;">$399.99</span></div>
      </div>
    </div>
  </div>
</body>
</html>
