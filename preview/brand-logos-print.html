<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Brio — Logo lockups</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { padding: 24px; background: #fff; font-family: 'Centura No 2', Nunito, system-ui, sans-serif; margin: 0; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .cell { border-radius: 1.6rem; padding: 28px 22px; display: flex; flex-direction: column; align-items: center; gap: 18px; box-shadow: 0 2px 12px rgba(0,163,224,0.08); border: 1px solid #E4E1E5; min-height: 160px; justify-content: center; break-inside: avoid; }
  .cell.dark { background: #004D7A; border-color: transparent; }
  .cell img { height: 64px; width: auto; }
  .lbl { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #9EA1A2; }
  .cell.dark .lbl { color: #90C6EA; }

  @page { size: landscape; margin: 1cm; }
  @media print {
    html, body { background: #fff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .cell { box-shadow: 0 0 0 1px #E4E1E5 !important; }
    .cell.dark { background: #004D7A !important; }
  }
</style>
</head>
<body>
  <div class="grid">
    <div class="cell"><img src="../assets/logo-color.svg?v=4" alt="Brio color" /><span class="lbl">Color · on white</span></div>
    <div class="cell"><img src="../assets/logo-mono.svg?v=4" alt="Brio mono" /><span class="lbl">Mono · grayscale</span></div>
    <div class="cell dark"><img src="../assets/logo-reversed.svg?v=4" alt="Brio reversed" /><span class="lbl">Reversed · on navy</span></div>
  </div>
  <script>
    (async () => {
      if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch (e) {} }
      // Wait for images to load
      const imgs = Array.from(document.images);
      await Promise.all(imgs.map(img => img.complete ? null : new Promise(r => { img.onload = img.onerror = r; })));
      setTimeout(() => window.print(), 500);
    })();
  </script>
</body>
</html>
