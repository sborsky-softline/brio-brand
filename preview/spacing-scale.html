<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Brio — Spacing scale</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { padding: 22px 28px; background: #fff; }
  .row { display: grid; grid-template-columns: 90px 1fr 90px; gap: 12px; align-items: center; padding: 6px 0; }
  .name { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #00A3E0; }
  .bar  { background: #00A3E0; height: 12px; border-radius: 4px; }
  .val  { font-size: 11px; color: #9EA1A2; font-family: ui-monospace, monospace; text-align: right; }
</style>
</head>
<body>
  <div class="row"><div class="name">XS</div><div class="bar" style="width:4px;"></div><div class="val">0.4rem · 4px</div></div>
  <div class="row"><div class="name">S</div> <div class="bar" style="width:8px;"></div><div class="val">0.8rem · 8px</div></div>
  <div class="row"><div class="name">M</div> <div class="bar" style="width:16px;"></div><div class="val">1.6rem · 16px</div></div>
  <div class="row"><div class="name">L</div> <div class="bar" style="width:24px;"></div><div class="val">2.4rem · 24px</div></div>
  <div class="row"><div class="name">XL</div><div class="bar" style="width:48px;"></div><div class="val">4.8rem · 48px</div></div>
  <div class="row"><div class="name">2XL</div><div class="bar" style="width:80px;"></div><div class="val">8rem · 80px</div></div>
  <div class="row"><div class="name">3XL</div><div class="bar" style="width:120px;"></div><div class="val">12rem · 120px</div></div>
</body>
</html>
