<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Brio — Iconography</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { padding: 22px 28px; background: #fff; font-family: 'Centura No 2', Nunito, system-ui, sans-serif; }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 18px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .cell svg { width: 32px; height: 32px; color: #24282B; }
  .lbl { font-size: 10px; color: #9EA1A2; letter-spacing: 0.04em; text-transform: uppercase; font-weight: 500; }
  .meta { font-size: 11px; color: #9EA1A2; margin-top: 14px; padding-top: 10px; border-top: 1px solid #E4E1E5; }
  .meta b { color: #00A3E0; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; font-size: 10px; }
</style>
</head>
<body>
  <div class="grid">
    <div class="cell">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <div class="lbl">Search</div>
    </div>
    <div class="cell">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
      <div class="lbl">Account</div>
    </div>
    <div class="cell">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h2l3 12h11l2-9H6"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg>
      <div class="lbl">Cart</div>
    </div>
    <div class="cell">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 C 12 2, 5 11, 5 16 a 7 7 0 0 0 14 0 C 19 11, 12 2, 12 2 Z"/></svg>
      <div class="lbl">Drop</div>
    </div>
    <div class="cell">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18l-2 13H5L3 6z"/><path d="M8 6V4h8v2"/></svg>
      <div class="lbl">Filter</div>
    </div>
    <div class="cell">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 12l2 2 4-4"/></svg>
      <div class="lbl">NSF</div>
    </div>
    <div class="cell">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h3l3-8 4 16 3-8h5"/></svg>
      <div class="lbl">Pulse</div>
    </div>
    <div class="cell">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>
      <div class="lbl">Check</div>
    </div>
    <div class="cell">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      <div class="lbl">Menu</div>
    </div>
    <div class="cell">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      <div class="lbl">Chevron</div>
    </div>
    <div class="cell">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5l3 2"/></svg>
      <div class="lbl">Time</div>
    </div>
    <div class="cell">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 12l9 4 9-4"/><path d="M3 17l9 4 9-4"/></svg>
      <div class="lbl">Layers</div>
    </div>
  </div>
  <div class="meta"><b>System</b> · 1.75px stroke · rounded line caps · 24×24 grid · color follows currentColor (defaults to charcoal; brand contexts use blue)</div>
</body>
</html>
